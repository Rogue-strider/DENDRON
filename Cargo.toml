[package]
name = "dendron"
version = "0.1.0"
edition = "2021"
authors = ["Rogue-strider <satyamjha91064@gmail.com>"]
description = "A powerful dependency graph visualizer and analyzer for Rust projects"
license = "MIT"
repository = "https://github.com/Rogue-strider/DENDRON"
homepage = "https://github.com/Rogue-strider/DENDRON"
documentation = "https://github.com/Rogue-strider/DENDRON#readme"
readme = "README.md"
keywords = ["dependencies", "visualization", "cargo", "analysis", "graph"]
categories = ["development-tools", "command-line-utilities", "visualization"]

[dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
colored = "2.1"
cargo_metadata = "0.18"

[[bin]]
name = "dendron"
path = "src/main.rs"